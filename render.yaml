services:
  - type: web
    name: paper-ocr-bot
    runtime: python
    buildCommand: ""
    startCommand: "python3 line_bot_server.py"
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
